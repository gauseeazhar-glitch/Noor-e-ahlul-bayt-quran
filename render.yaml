# Render Blueprint: Noor-e-Ahlul Bayt – Quran & Tafsir (static site, free plan)
services:
  - type: web
    runtime: static
    name: noor-e-ahlul-bayt
    buildCommand: echo "No build step - static files"
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    headers:
      - path: /data/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
