<style>/* Noor-e-Ahlul Bayt — design tokens
   Layout: a calm reading column framed by pointed arches; the 8-point khatam star
   is the only ornament, repeated as a faint lattice in the header and medallions. */
:root{
  --bg:#F5EFE0; --surface:#FFFBF2; --surface-2:#EFE6D0; --ink:#1B2620; --muted:#5B675F;
  --green:#0E4D35; --green-2:#17694A; --on-green:#FBF5E6; --gold:#9C7224; --gold-2:#C59B4C; --gold-soft:#EADBB4;
  --line:rgba(14,77,53,.16); --pattern:rgba(197,155,76,.22); --shadow:0 1px 2px rgba(30,40,30,.06),0 8px 24px -12px rgba(30,50,35,.18);
  --ok:#2E7D4F; --warn:#9A6B00; --info:#2D5C8A;
  --f-quran:"Amiri Quran","Scheherazade New","Noto Naskh Arabic",serif;
  --f-ar:"Amiri","Scheherazade New","Noto Naskh Arabic",serif;
  --f-ur:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq","Noto Naskh Arabic",serif;
  --f-fa:"Vazirmatn","Noto Naskh Arabic",sans-serif;
  --f-gu:"Noto Sans Gujarati",sans-serif; --f-hi:"Noto Sans Devanagari",sans-serif;
  --f-display:"Marcellus","Cormorant Garamond",Georgia,serif;
  --f-body:"Source Serif 4",Georgia,serif; --f-ui:"Figtree","Segoe UI",system-ui,sans-serif;
  --ar-size:34px; --ar-lh:2.15; --tr-size:17px; --radius:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1510; --surface:#0F1F17; --surface-2:#15291F; --ink:#ECE4CF; --muted:#A3B0A5;
  --green:#5DBE92; --green-2:#7FD0AA; --on-green:#0A1510; --gold:#D8B46A; --gold-2:#E7C887; --gold-soft:#3A3220;
  --line:rgba(216,180,106,.18); --pattern:rgba(216,180,106,.10); --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
  --ok:#6BCB93; --warn:#E3B54F; --info:#8DB8E3; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1510; --surface:#0F1F17; --surface-2:#15291F; --ink:#ECE4CF; --muted:#A3B0A5;
  --green:#5DBE92; --green-2:#7FD0AA; --on-green:#0A1510; --gold:#D8B46A; --gold-2:#E7C887; --gold-soft:#3A3220;
  --line:rgba(216,180,106,.18); --pattern:rgba(216,180,106,.10); --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
  --ok:#6BCB93; --warn:#E3B54F; --info:#8DB8E3; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-ui);-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--green)}
a{color:var(--green-2)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lattice{position:relative;isolation:isolate}
.lattice::after{content:"";position:absolute;inset:0;z-index:-1;background:var(--pattern);pointer-events:none;

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--green);color:var(--on-green);border-bottom:2px solid var(--gold-2)}
:root[data-theme="dark"] .top{background:#0C2419}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .top{background:#0C2419;color:var(--ink)}}
:root[data-theme="dark"] .top{color:var(--ink)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:60px;flex-wrap:wrap;padding-block:6px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;margin-right:auto;min-width:0}
.brand svg{flex:none}
.brand b{font:400 20px/1.1 var(--f-display);letter-spacing:.02em;white-space:nowrap}
.brand small{display:block;font:11px/1.2 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.nav{display:flex;gap:2px;flex-wrap:wrap}
.nav a{color:inherit;text-decoration:none;padding:7px 11px;border-radius:999px;font-size:14px;opacity:.86}
.nav a[aria-current="page"],.nav a:hover{background:rgba(255,255,255,.12);opacity:1}
.tools{display:flex;gap:6px;align-items:center}
.iconbtn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.22);background:transparent;color:inherit;cursor:pointer}
.iconbtn:hover{background:rgba(255,255,255,.12)}
.top select{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:7px 12px;max-width:190px;color:inherit}
.top select option,.top select optgroup{color:#111;background:#fff}
@media (max-width:760px){.nav{order:3;width:100%;justify-content:space-between}.nav a{padding:6px 8px;font-size:13px}.top select{max-width:140px}}

/* Generic */
main{padding-block:24px 80px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0}
h2{font-size:26px} h3{font-size:19px}
.eyebrow{font:600 11.5px/1 var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--gold-2)}
.btn.primary{background:var(--green);color:var(--on-green);border-color:var(--green)}
.btn.gold{background:var(--gold-2);color:#1b1407;border-color:var(--gold-2)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--green);color:var(--on-green);border-color:var(--green)}
.badge{display:inline-flex;align-items:center;gap:5px;font:600 11px/1 var(--f-ui);letter-spacing:.04em;padding:4px 8px;border-radius:6px}
.badge.ab{background:rgba(14,77,53,.12);color:var(--green-2)}
.badge.gen{background:rgba(156,114,36,.14);color:var(--gold)}
.badge.tl{background:rgba(45,92,138,.12);color:var(--info)}
.badge.warn{background:rgba(154,107,0,.14);color:var(--warn)}
.grid{display:grid;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.notice{border-left:3px solid var(--gold-2);background:var(--surface-2);padding:10px 14px;border-radius:0 10px 10px 0;font-size:14px}
input[type=search],input[type=text],input[type=number],textarea,.field select{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
textarea{min-height:90px;resize:vertical}

/* Home */
.hero{border-radius:22px;overflow:hidden;background:var(--green);color:var(--on-green);text-align:center;padding:34px 18px 28px}
:root[data-theme="dark"] .hero{background:#0C2419;color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero{background:#0C2419;color:var(--ink)}}
.arch{max-width:640px;margin:0 auto;padding:30px 20px 22px;border:1.5px solid var(--gold-2);border-radius:320px 320px 18px 18px/150px 150px 18px 18px;position:relative}
.arch::before{content:"";position:absolute;inset:7px;border:1px solid rgba(197,155,76,.45);border-radius:inherit;pointer-events:none}
.bismillah{font:400 clamp(30px,6vw,52px)/1.9 var(--f-quran);color:var(--gold-2);direction:rtl}
.hero h1{font-size:clamp(26px,4.4vw,40px);margin-top:4px}
.hero p{max-width:56ch;margin:8px auto 0;opacity:.85}
.search-hero{max-width:560px;margin:18px auto 0;display:flex;gap:8px}
.search-hero input{border-color:rgba(197,155,76,.6);background:rgba(255,255,255,.95);color:#1b2620}
.home-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;margin-top:22px}
@media (max-width:820px){.home-grid{grid-template-columns:1fr}}
.daily{padding:22px}
.daily .ar{font:400 calc(var(--ar-size)*.85)/2 var(--f-quran);direction:rtl;text-align:right;margin:12px 0}
.continue{padding:22px;display:flex;flex-direction:column;gap:10px}
.feature{margin-top:26px}
.feature-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:12px}
.feature-item{padding:16px;cursor:pointer;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);color:var(--ink)}
.feature-item:hover{border-color:var(--gold-2)}
.feature-item .ref{font:600 12px var(--f-ui);color:var(--gold)}
.feature-item h3{font-size:17px;margin:6px 0}
.feature-item p{font-size:14px;color:var(--muted);margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* Surah index */
.index-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-top:30px}
.index-tools{display:flex;gap:8px;flex-wrap:wrap}
.index-tools input{width:220px}
.surahs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:14px}
.surah{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 14px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px}
.surah:hover{border-color:var(--gold-2)}
.star{width:40px;height:40px;display:grid;place-items:center;position:relative;font:600 13px var(--f-ui);color:var(--green-2);font-variant-numeric:tabular-nums}
.star::before,.star::after{content:"";position:absolute;inset:6px;border:1.5px solid var(--gold-2);border-radius:3px}
.star::after{transform:rotate(45deg)}
.surah .ar{font:400 22px/1.3 var(--f-ar);color:var(--green-2)}
.surah .meta{font-size:12.5px;color:var(--muted)}
.surah .prog{height:3px;background:var(--surface-2);border-radius:3px;margin-top:5px;overflow:hidden}
.surah .prog i{display:block;height:100%;background:var(--gold-2)}

/* Reader */
.reader-head{text-align:center;padding:26px 14px 18px;border-radius:20px;margin-bottom:14px}
.reader-head .name-ar{font:400 40px/1.5 var(--f-ar);color:var(--green-2)}
.reader-head .facts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.toolbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:40;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow)}
@media (max-width:760px){.top{position:relative;top:auto}.toolbar{top:env(safe-area-inset-top,0px);gap:6px;padding:6px}.toolbar select{max-width:46%;font-size:14px}.toolbar .grow{display:none}.ayah{scroll-margin-top:110px;padding:14px 12px 10px}}
.toolbar select{padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);max-width:220px}
.toolbar .grow{flex:1}
.player{display:flex;gap:6px;align-items:center}
.pbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.pbtn.on{background:var(--green);color:var(--on-green);border-color:var(--green)}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;padding:14px;margin-top:10px}
.settings label{display:grid;gap:6px;font-size:13px;color:var(--muted)}
.settings input[type=range]{accent-color:var(--gold)}
.bism{font:400 calc(var(--ar-size)*1.05)/2 var(--f-quran);text-align:center;color:var(--green-2);margin:18px 0 6px;direction:rtl}
.ayah{padding:18px 18px 12px;margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);scroll-margin-top:150px;transition:border-color .2s}
.ayah.playing{border-color:var(--gold-2);box-shadow:0 0 0 3px var(--gold-soft)}
.ayah.target{border-color:var(--green-2)}
.ayah-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ayah-ref{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.actions{display:flex;gap:2px;flex-wrap:wrap}
.act{border:0;background:transparent;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.act:hover{background:var(--surface-2);color:var(--ink)}
.act[aria-pressed="true"]{color:var(--gold)}
.ar-text{font-family:var(--f-quran);font-size:var(--ar-size);line-height:var(--ar-lh);direction:rtl;text-align:right;margin:10px 0 6px;color:var(--ink);word-spacing:.06em}
.ar-text .end{font-family:var(--f-quran);color:var(--gold);margin-right:.2em;white-space:nowrap}
.tr{font-family:var(--f-body);font-size:var(--tr-size);line-height:1.7;margin:6px 0 0;color:var(--ink)}
.tr[dir=rtl]{text-align:right}
.tr.ur{font-family:var(--f-ur);line-height:2.3;font-size:calc(var(--tr-size)*1.05)}
.tr.fa{font-family:var(--f-fa);line-height:2}
.tr.gu{font-family:var(--f-gu)} .tr.hi{font-family:var(--f-hi)}
.tr.tl{font-style:italic;color:var(--muted)}
.tr-label{font-size:11.5px;color:var(--muted);margin-top:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ayah-foot{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.explain{margin-top:14px;border-top:1px dashed var(--line);padding-top:14px;display:grid;gap:12px}
details.sec{border:1px solid var(--line);border-radius:12px;background:var(--bg);overflow:hidden}
details.sec>summary{cursor:pointer;list-style:none;padding:12px 14px;display:flex;gap:10px;align-items:center;font-weight:600;font-size:14.5px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"+";margin-left:auto;color:var(--gold);font-size:18px}
details.sec[open]>summary::after{content:"–"}
details.sec .body{padding:0 14px 14px;font-size:15px}
.kind{font:700 10.5px/1 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;padding:4px 7px;border-radius:5px}
.kind.q{background:var(--green);color:var(--on-green)} .kind.t{background:var(--gold-2);color:#1b1407} .kind.h{background:var(--info);color:#fff}
.src{font-size:13px;border-left:2px solid var(--gold-2);padding:6px 10px;margin-top:8px;background:var(--surface)}
.src .ar{font-family:var(--f-ar);direction:rtl;font-size:16px}
.hadith{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px;background:var(--surface)}
.hadith .ar{font:400 19px/2 var(--f-ar);direction:rtl;text-align:right;max-height:12em;overflow:auto}
.hadith .en{font-family:var(--f-body);font-size:15px;max-height:14em;overflow:auto;margin-top:8px}
.hadith .ref{font-size:12.5px;color:var(--muted);margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.related{display:flex;gap:8px;flex-wrap:wrap}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:22px}

/* Search */
.search-box{display:flex;gap:8px}
.scopes{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.results{display:grid;gap:10px;margin-top:16px}
.result{padding:14px;text-decoration:none;color:var(--ink);display:block}
.result:hover{border-color:var(--gold-2)}
.result .ar{font:400 22px/1.9 var(--f-quran);direction:rtl;text-align:right}
mark{background:var(--gold-soft);color:inherit;border-radius:3px;padding:0 2px}

/* Me */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{padding:16px}
.stat b{display:block;font:400 30px/1.1 var(--f-display);color:var(--green-2);font-variant-numeric:tabular-nums}
.ring{--p:0;width:110px;height:110px;border-radius:50%;background:conic-gradient(var(--gold-2) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center}
.ring span{width:84px;height:84px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font:400 22px var(--f-display)}
.list{display:grid;gap:8px}
.li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-decoration:none;color:var(--ink)}
.li .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 10px}

/* Sources */
.prose{max-width:72ch}
.prose p{margin:.5em 0}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.scroll{overflow-x:auto}

/* Toast + dialog */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:90;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);padding:20px;max-width:min(520px,calc(100% - 32px));width:100%}
dialog::backdrop{background:rgba(0,0,0,.45)}
.foot{border-top:1px solid var(--line);padding-block:22px;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

catch { DB = structuredClone(DEFAULT); }

/* ---------- data ---------- */
const D = { meta: null, cat: null, ar: null, search: null, tl: null, eds: {}, notes: null, notesBy: {}, related: null, topics: null, links: {}, buckets: {}, nahj: null, library: null };
const cache = {};
const getJSON = (url) => cache[url] || (cache[url] = fetch(url).then(r => { if (!r.ok) throw new Error(r.status + " " + url); return r.json(); }).catch(e => { delete cache[url]; throw e; }));

const RECITERS = [
  ["Alafasy_128kbps", "Mishary Rashid Alafasy"],
  ["Abdul_Basit_Murattal_192kbps", "Abdul Basit (Murattal)"],
  ["Minshawy_Murattal_128kbps", "Muhammad Siddiq al-Minshawi"],
  ["Husary_128kbps", "Mahmoud Khalil al-Husary"],
  ["Parhizgar_48kbps", "Shahriar Parhizgar"],
  ["Ghamadi_40kbps", "Saad al-Ghamdi"],
];
const LANG_CLASS = { ur: "ur", fa: "fa", gu: "gu", hi: "hi", "ar-la": "tl" };

const S = (gi) => { // global index -> {s,a}
  const ss = D.meta.surahs; let lo = 0, hi = ss.length - 1;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (ss[m].start <= gi) lo = m; else hi = m - 1; }
  return { s: ss[lo].n, a: gi - ss[lo].start + 1 };
};
const G = (s, a) => D.meta.surahs[s - 1].start + a - 1;
const refStr = gi => { const { s, a } = S(gi); return `${s}:${a}`; };
const parseRef = r => { const [s, a] = r.split(":").map(Number); return G(s, a); };

function edInfo(id) {
  return D.cat.bundled.find(e => e.id === id) || D.cat.remote.find(e => e.id === id);
}
function langEditions(lang) {
  if (lang.startsWith("remote:")) { const L = lang.slice(7); return D.cat.remote.filter(e => e.language === L); }
  return D.cat.bundled.filter(e => e.lang === lang);
}
function pending(lang) { return D.cat.pending.find(p => p.lang === lang); }
function currentEdition() {
  const p = pending(set.lang);
  if (p) return p.fallback;
  const eds = langEditions(set.lang);
  return eds.some(e => e.id === set.ed) ? set.ed : (eds[0] || D.cat.bundled[0]).id;
}
async function loadEdition(id) {
  if (D.eds[id]) return D.eds[id];
  const b = D.cat.bundled.find(e => e.id === id);
  if (b) return (D.eds[id] = await getJSON(b.file));
  const r = D.cat.remote.find(e => e.id === id);
  const j = await getJSON(r.url);
  return (D.eds[id] = j.quran.map(v => v.text));
}
async function loadLinks(s) {
  if (D.links[s]) return D.links[s];
  if (!D.allLinks) { try { D.allLinks = await getJSON("data/hadith/links.json"); } catch { D.allLinks = {}; } }
  const sur = D.meta.surahs[s - 1], out = {};
  for (let gi = sur.start; gi < sur.start + sur.count; gi++) if (D.allLinks[gi]) out[gi] = D.allLinks[gi];
  return (D.links[s] = out);
}
async function loadNarrations(keys) {
  const need = [...new Set(keys.map(k => crc32(k) % 8))];
  await Promise.all(need.map(async b => { if (!D.buckets[b]) D.buckets[b] = await getJSON(`data/hadith/b/${b}.json`); }));
  return keys.map(k => D.buckets[crc32(k) % 8][k]).filter(Boolean);
}

function route() {

  if (h === "search") return viewSearch();

  if (h === "sources") return viewSources();
  return viewHome();
}
function setNav(name) { $$(".nav a").forEach(a => a.dataset.v === name ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current")); }
const go = h => { if (location.hash === "#" + h) route(); else location.hash = h; };

function badgeFor(e) {
  if (!e) return "";

  if (e.school === "translit") return `<span class="badge tl">Transliteration</span>`;
  return `<span class="badge gen" title="No Ahlul Bayt-based translation is available in this language yet">General scholarly translation</span>`;
}
function trHTML(gi, texts, e) {
  const lc = LANG_CLASS[e?.lang] || "";

  let h = `<p class="tr ${lc}" dir="${dir}" lang="${esc(e?.lang || "")}">${esc(texts[gi])}</p>`;
  if (set.showTl && D.tl && e?.id !== "ara-quran-la") h = `<p class="tr tl">${esc(D.tl[gi])}</p>` + h;
  return h;
}
function surahDaily(gi) { return D.meta.surahs[S(gi).s - 1]; }
function dailyAyah() {
  const d = Math.floor(Date.now() / 864e5);
  let gi = (d * 2654435761) % 6236;
  while (D.ar[gi].length < 70) gi = (gi + 1) % 6236;
  return gi;
}
const isRead = gi => DB.read[gi] === "1";
function markRead(gi) {
  if (isRead(gi)) return;
  if (DB.read.length < 6236) DB.read = DB.read.padEnd(6236, "0");
  DB.read = DB.read.slice(0, gi) + "1" + DB.read.slice(gi + 1);
  DB.daily[today()] = (DB.daily[today()] || 0) + 1;
  save();
}
const readCount = (from = 0, to = 6236) => { let c = 0; for (let i = from; i < to; i++) if (DB.read[i] === "1") c++; return c; };
function setLast(gi) {
  DB.last = { gi, t: Date.now() };
  const h = DB.history; if (!h.length || S(h[0].gi).s !== S(gi).s) h.unshift({ gi, t: Date.now() }); else h[0] = { gi, t: Date.now() };
  DB.history = h.slice(0, 60); save();
}

  $("#pPrev").onclick = () => playGi(Math.max((player.s === s ? player.gi : sur.start + 1) - 1, sur.start));
  $("#pRep").onclick = () => { set.repeat = { off: "ayah", ayah: "surah", surah: "off" }[set.repeat]; $("#repSel").value = set.repeat; save(); paintPlayer(); toast({ off: "Repeat off", ayah: "Repeating current ayah", surah: "Repeating whole surah" }[set.repeat]); };
  paintPlayer();

  const box = $("#ayahs");
  const frag = [];
  for (let i = 0; i < sur.count; i++) {
    const gi = sur.start + i, n = i + 1, nl = links[gi]?.length || 0;
    frag.push(`<article class="ayah" id="a${s}-${n}" data-gi="${gi}">
      <div class="ayah-top">

        ${nl ? `<span class="chip" style="cursor:default"><span class="kind h">Hadith</span> ${nl} narration${nl > 1 ? "s" : ""}</span>` : ""}
        ${DB.notes[gi] ? `<span class="chip" style="cursor:default">My note</span>` : ""}
      </div>
      <div class="explain" hidden></div>
    </article>`);
  }
  box.innerHTML = frag.join("");
  box.onclick = onAyahClick;

  // progress tracking: an ayah counts as read after 1.5s on screen
  const timers = new Map();
  io = new IntersectionObserver(ents => ents.forEach(en => {
    const gi = +en.target.dataset.gi;
    if (en.isIntersecting) timers.set(gi, setTimeout(() => markRead(gi), 1500));
    else { clearTimeout(timers.get(gi)); timers.delete(gi); }
  }), { threshold: 0.6 });
  $$(".ayah", box).forEach(el => io.observe(el));
  let lastT;
  lastIO = new IntersectionObserver(ents => {
    const vis = ents.filter(x => x.isIntersecting).map(x => +x.target.dataset.gi);
    if (vis.length) { clearTimeout(lastT); lastT = setTimeout(() => setLast(Math.min(...vis)), 600); }
  }, { rootMargin: "-140px 0px -55% 0px" });
  $$(".ayah", box).forEach(el => lastIO.observe(el));

  if (a) {
    const el = $(`#a${s}-${a}`);
    if (el) { el.classList.add("target"); requestAnimationFrame(() => el.scrollIntoView({ block: "start" })); setLast(G(s, a)); }
  } else { window.scrollTo(0, 0); setLast(sur.start); }
  if (openExplainFor) { const [os, oa] = openExplainFor.split(":").map(Number); openExplainFor = null; if (os === s) toggleExplain($(`#a${os}-${oa}`), true); }
}

    const nq = q.toLowerCase().replace(/[^a-z0-9؀-ۿ]/g, "");
    const ss = D.meta.surahs.filter(s => nq && (String(s.n) === q || s.tr.toLowerCase().replace(/[^a-z0-9]/g, "").includes(nq) || s.en.toLowerCase().replace(/[^a-z0-9]/g, "").includes(nq) || (isArabic(q) && normAr(s.ar).includes(normAr(q)))));
    if (ss.length) out.push(`<h3>Surahs</h3><div class="surahs">${ss.map(s => `<a class="surah" href="#s${s.n}"><span class="star">${s.n}</span><span><b>${esc(s.tr)}</b><div class="meta">${esc(s.en)} · ${s.count} ayahs</div></span><span class="ar" lang="ar">${esc(s.ar.replace(/^سُورَةُ\s*/, ""))}</span></a>`).join("")}</div>`);
  }
  if ((sc === "all" || sc === "arabic") && isArabic(q)) {
    if (!D.search) D.search = await getJSON("data/t/ara-search.json");
    const nq = normAr(q); const hits = [];
    for (let i = 0; i < 6236 && hits.length < 200; i++) if (D.search[i].includes(nq)) hits.push(i);
    out.push(`<h3>Arabic text · ${hits.length >= 200 ? "200+" : hits.length} ayahs</h3>` + (hits.slice(0, 60).map(gi => ayahCard(gi)).join("") || "<p class='muted'>No ayah contains that Arabic word.</p>"));
  }
  if ((sc === "all" || sc === "translation") && q.length > 1 && (!isArabic(q) || e.dir === "rtl")) {
    const lq = q.toLowerCase(); const hits = [];
    for (let i = 0; i < 6236 && hits.length < 300; i++) if (tr[i].toLowerCase().includes(lq)) hits.push(i);
    if (hits.length || sc === "translation") out.push(`<h3>${esc(e.translator)} translation · ${hits.length >= 300 ? "300+" : hits.length} ayahs</h3>` + (hits.slice(0, 60).map(gi => ayahCard(gi, hl(tr[gi], q))).join("") || "<p class='muted'>No match in this translation.</p>"));
  }
  if (sc === "all" || sc === "topics") {
    const ts = Object.keys(D.topics.topics).filter(t => !q || t.toLowerCase().includes(q.toLowerCase()));
    if (ts.length || sc === "topics") out.push(`<h3>Topics</h3>` + topicChips(ts));
  }
  if (sc === "all" || sc === "tafsir") {
    const lq = q.toLowerCase();
    const ns = D.notes.notes.filter(n => [n.ref, n.title, n.summary, n.context, ...n.sources.flatMap(x => [x.work, x.author, x.location, x.ar])].join(" ").toLowerCase().includes(lq) || n.sources.some(x => x.ar.includes(q)));
    if (ns.length || sc === "tafsir") out.push(`<h3>Ahlul Bayt tafsir notes · ${ns.length}</h3>` + (ns.map(n => `<a class="card result" href="#s${n.ref.replace(":", "-")}" data-open="${n.ref}"><span class="kind t">Tafsir</span> <b>${n.ref} · ${esc(n.title)}</b><p style="margin:6px 0 0">${hl(n.summary, q)}</p><p class="muted" style="font-size:12.5px;margin:6px 0 0">${n.sources.map(x => esc(x.work)).join(" · ")}</p></a>`).join("") || "<p class='muted'>No tafsir note matches.</p>"));
  }
  if (sc === "all" || sc === "narrations") {
    if (!D.nahj) { try { D.nahj = await getJSON("data/hadith/nahj.json"); } catch { D.nahj = []; } }
    const lq = q.toLowerCase(); const nq = normAr(q);
    const hits = D.nahj.filter(h => isArabic(q) ? normAr(h.ar).includes(nq) : h.en.toLowerCase().includes(lq)).slice(0, sc === "all" ? 5 : 30);
    out.push(`<h3>Imams' narrations · Nahj al-Balagha (offline) · ${hits.length}</h3>` + (hits.map(hadithHTML).join("") || "<p class='muted'>No match in Nahj al-Balagha.</p>") + `<button class="btn" id="liveQ">Search ${esc(q)} in all books on Thaqalayn (online)</button><div id="liveQRes"></div>`);
  }
  res.innerHTML = out.join("") || `<p class="muted">Nothing found for “${esc(q)}”. Check the spelling or choose another search scope.</p>`;
  bindTopics();
  $$("[data-open]", res).forEach(a => a.onclick = () => { openExplainFor = a.dataset.open; });
  const lb = $("#liveQ"); if (lb) lb.onclick = async () => {
    const o = $("#liveQRes"); o.innerHTML = "<p class='muted'>Searching…</p>";
    try { const r = await fetch(`https://www.thaqalayn-api.net/api/v2/query?q=${encodeURIComponent(q)}`); if (!r.ok) throw 0; const list = (await r.json()).slice(0, 25);
      o.innerHTML = list.map(h => hadithHTML({ id: h.id, book: h.book, bookId: h.bookId, vol: h.volume, author: h.author, tr: h.translator, cat: h.category, ch: h.chapter, url: h.URL, ar: h.arabicText, en: h.englishText, g: Object.fromEntries(["majlisiGrading", "mohseniGrading", "behbudiGrading"].filter(k => h[k]).map(k => [k, h[k]])) })).join("") || "<p class='muted'>No matches.</p>";
    } catch { o.innerHTML = "<p class='notice'>The Thaqalayn service could not be reached from this page. Search directly at <a href='https://thaqalayn.net' target='_blank' rel='noopener'>thaqalayn.net</a>.</p>"; }
  };
}
function topicChips(list = Object.keys(D.topics.topics)) { return `<div class="row">${list.map(t => `<button class="chip" data-topic="${esc(t)}">${esc(t)} · ${D.topics.topics[t].length}</button>`).join("")}</div>`; }
function bindTopics() { $$("[data-topic]").forEach(b => b.onclick = () => { searchState.topic = b.dataset.topic; runSearch(); }); }

/* ---------- MY READING ---------- */
let meTab = "bookmarks";
async function viewMe() {
  setNav("me"); current = { view: "me" };
  const ed = currentEdition(); const tr = await loadEdition(ed);
  const total = readCount(); const t = DB.daily[today()] || 0;
  let streak = 0; for (let d = new Date(); ; d.setDate(d.getDate() - 1)) { const k = d.toISOString().slice(0, 10); if ((DB.daily[k] || 0) > 0) streak++; else if (k !== today()) break; if (streak > 3650) break; }
  const doneSurahs = D.meta.surahs.filter(s => readCount(s.start, s.start + s.count) === s.count).length;
  const item = gi => { const { s, a } = S(gi); return `<a class="li" href="#s${s}-${a}"><span class="t"><b>${s}:${a}</b> ${esc(D.meta.surahs[s - 1].tr)} — <span class="muted">${esc(tr[gi])}</span></span><span>→</span></a>`; };
  const tabs = {
    bookmarks: DB.bookmarks.map(item).join("") || "<p class='muted'>Tap the bookmark icon on any ayah to keep your place.</p>",
    favourites: DB.favs.map(item).join("") || "<p class='muted'>Tap the heart on an ayah you love.</p>",
    notes: Object.entries(DB.notes).map(([gi, n]) => { const { s, a } = S(+gi); return `<a class="li" href="#s${s}-${a}" style="display:block"><b>${s}:${a} ${esc(D.meta.surahs[s - 1].tr)}</b><div style="white-space:pre-wrap;font-family:var(--f-body)">${esc(n)}</div></a>`; }).join("") || "<p class='muted'>Use the pen icon on an ayah to write a reflection.</p>",
    history: DB.history.map(h => { const { s, a } = S(h.gi); return `<a class="li" href="#s${s}-${a}"><span class="t"><b>${esc(D.meta.surahs[s - 1].tr)}</b> · ayah ${a}</span><span class="muted" style="font-size:13px">${new Date(h.t).toLocaleString()}</span></a>`; }).join("") || "<p class='muted'>Surahs you open will appear here.</p>",
  };
  app.innerHTML = `<span class="eyebrow">My reading</span><h2 style="margin-bottom:14px">Progress, goals and saved ayahs</h2>
  <div class="stats">
    <div class="card stat"><span class="muted">Ayahs read</span><b>${total.toLocaleString()}</b><span class="muted">${(total / 62.36).toFixed(1)}% of the Quran</span></div>
    <div class="card stat"><span class="muted">Surahs completed</span><b>${doneSurahs}</b><span class="muted">of 114</span></div>
    <div class="card stat"><span class="muted">Daily streak</span><b>${streak}</b><span class="muted">day${streak === 1 ? "" : "s"} in a row</span></div>
    <div class="card stat row" style="flex-wrap:nowrap"><div class="ring" style="--p:${Math.min(100, Math.round(t / DB.goal * 100))}"><span>${t}</span></div><div><span class="muted">Today's goal</span><div class="row" style="margin-top:6px"><label class="sr" for="goal">Ayahs per day</label><input id="goal" type="number" min="1" max="6236" value="${DB.goal}" style="width:90px"> <span class="muted">ayahs/day</span></div></div></div>
  </div>
  <div class="card" style="padding:16px;margin-top:14px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between">
    <div>${DB.last ? `<b>Continue:</b> ${esc(D.meta.surahs[S(DB.last.gi).s - 1].tr)} ${refStr(DB.last.gi)}` : "<b>No reading yet.</b> Start with al-Fatiha."}</div>
    <div class="row"><a class="btn primary" href="${DB.last ? `#s${S(DB.last.gi).s}-${S(DB.last.gi).a}` : "#s1"}">Continue reading</a>
    <label class="btn" style="cursor:pointer"><input type="checkbox" id="notif" ${DB.notify ? "checked" : ""}> Daily ayah notification</label></div>
  </div>
  <div class="tabs" role="tablist">${["bookmarks", "favourites", "notes", "history"].map(k => `<button class="chip" role="tab" data-tab="${k}" aria-pressed="${meTab === k}">${k[0].toUpperCase() + k.slice(1)} (${k === "bookmarks" ? DB.bookmarks.length : k === "favourites" ? DB.favs.length : k === "notes" ? Object.keys(DB.notes).length : DB.history.length})</button>`).join("")}</div>
  <div class="list" id="meList">${tabs[meTab]}</div>
  <p class="muted" style="font-size:13px;margin-top:20px">Your progress, bookmarks and notes are stored only in this browser on this device.</p>`;
  $$("[data-tab]").forEach(b => b.onclick = () => { meTab = b.dataset.tab; viewMe(); });
  $("#goal").onchange = ev => { DB.goal = Math.max(1, +ev.target.value || 20); save(); viewMe(); };
  $("#notif").onchange = async ev => {
    if (!ev.target.checked) { DB.notify = false; save(); return toast("Daily notification off"); }
    try {
      if (!("Notification" in window)) throw 0;
      const p = await Notification.requestPermission(); if (p !== "granted") throw 0;
      DB.notify = true; DB.notifiedOn = ""; save(); dailyNotify(); toast("You'll get the Ayah of the day when you open the app each day");
    } catch { ev.target.checked = false; toast("Notifications are not available in this browser or page"); }
  };
  window.scrollTo(0, 0);
}
async function dailyNotify() {
  if (!DB.notify || DB.notifiedOn === today() || !("Notification" in window) || Notification.permission !== "granted") return;
  const gi = dailyAyah(); const tr = await loadEdition(currentEdition()); const { s, a } = S(gi);
  try { new Notification(`Ayah of the day · ${D.meta.surahs[s - 1].tr} ${s}:${a}`, { body: tr[gi].slice(0, 180) }); DB.notifiedOn = today(); save(); } catch {}
}

/* ---------- SOURCES ---------- */
function viewSources() {
  setNav("sources"); current = { view: "sources" };
  const row = e => `<tr><td>${esc(e.language)}</td><td>${esc(e.translator)}</td><td>${badgeFor(e)}</td><td>${esc(e.note)}</td></tr>`;
  app.innerHTML = `<div class="prose"><span class="eyebrow">Sources &amp; method</span><h2>How this platform handles the Quran, translation, tafsir and hadith</h2>
  <p>Each layer is labelled with its own marker so that the word of Allah is never confused with human explanation:</p>
  <p><span class="kind q">Quran</span> the Arabic text, unchanged. <span class="kind t">Tafsir</span> explanation by scholars. <span class="kind h">Hadith</span> narrations from the Prophet (PBUH) and the Imams (AS), quoted verbatim with their reference.</p>
  <h3 style="margin-top:20px">Arabic text and metadata</h3>
  <p>Uthmani script (Hafs ʿan ʿĀṣim) from the Tanzil Project, as published by the King Fahd Complex. Juz, ruku, page and sajda markers follow the Tanzil metadata. The text is reproduced without modification.</p>
  <h3 style="margin-top:20px">Translations</h3>
  <p>Translations from translators of the Shia Ithna Ashari tradition are marked <span class="badge ab">Ahlul Bayt scholar</span>. Where none exists in a language, a reputable general translation is shown and marked <span class="badge gen">General scholarly translation</span>, together with the Ahlul Bayt tafsir. No translation here is presented as the words of an Imam.</p></div>
  <div class="scroll card" style="margin-top:10px"><table class="tbl"><thead><tr><th>Language</th><th>Translator</th><th>Label</th><th>Note</th></tr></thead><tbody>${D.cat.bundled.map(row).join("")}${D.cat.pending.map(p => `<tr><td>${esc(p.language)}</td><td>—</td><td><span class="badge warn">Awaiting verified source</span></td><td>${esc(p.note)}</td></tr>`).join("")}</tbody></table></div>
  <p class="muted" style="font-size:13px">${D.cat.remote.length} further translations in ${new Set(D.cat.remote.map(e => e.language)).size} languages load on demand from the open fawazahmed0/quran-api collection (Tanzil and other published translations). They are labelled as general translations.</p>
  <div class="prose"><h3 style="margin-top:20px">Narrations</h3>
  <p>${"32,531"} narrations from ${D.books.length} books (al-Kafi, Man La Yahduruhu al-Faqih, Tahdhib al-Ahkam, the works of Shaykh al-Saduq, Kitab al-Ghayba, Nahj al-Balagha and others) come from <a href="https://thaqalayn.net" target="_blank" rel="noopener">thaqalayn.net</a> via the open Thaqalayn API dataset. A narration is linked to an ayah only when its Arabic text quotes that ayah or its English translation cites the verse number. Arabic, English, chapter, number, translator and the gradings of Allama Majlisi, Shaykh Asif Muhsini and Shaykh Muhammad Baqir Behbudi are shown exactly as published there, with a link to the original page.</p>
  <h3 style="margin-top:20px">Ahlul Bayt tafsir notes</h3>
  <p>${esc(D.notes.status)}</p>
  <h3 style="margin-top:20px">Classical works referenced</h3></div>
  <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr));margin-top:10px">${D.library.map(w => `<div class="card" style="padding:16px"><span class="eyebrow">${esc(w.kind)}</span><h3 style="margin:6px 0 2px">${esc(w.work)}</h3><div class="ar" lang="ar" style="font:400 20px/1.6 var(--f-ar);color:var(--green-2)">${esc(w.ar)}</div><p class="muted" style="font-size:13px;margin:4px 0">${esc(w.author)}</p><p style="font-size:14px;margin:0">${esc(w.about)}</p>${w.read ? `<a href="${esc(w.read)}" target="_blank" rel="noopener" style="font-size:13px">Read online ↗</a>` : ""}</div>`).join("")}</div>
  <div class="prose"><h3 style="margin-top:20px">Recitation</h3><p>Audio is streamed per ayah from EveryAyah.com.</p>
  <h3 style="margin-top:20px">Licences</h3><p>Tanzil text and translations: Creative Commons Attribution 3.0, verbatim use with attribution. fawazahmed0/quran-api: public domain packaging. Thaqalayn API dataset: published openly by its author; translations remain the work of their named translators. Check each translator's terms before commercial use.</p></div>`;
  window.scrollTo(0, 0);
}

/* ---------- boot ---------- */
async function boot() {
  $("#themeBtn").onclick = () => { const dark = document.documentElement.getAttribute("data-theme") === "dark" || (!document.documentElement.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches); set.theme = dark ? "light" : "dark"; save(); applyTheme(); };
  applyTheme(); applyType();
  try {
    [D.meta, D.cat, D.ar, D.notes, D.related, D.topics, D.library, D.books] = await Promise.all(["data/meta.json", "data/catalogue.json", "data/t/ara-uthmani.json", "data/ahlulbayt/notes.json", "data/related.json", "data/topics.json", "data/ahlulbayt/library.json", "data/hadith/books.json"].map(getJSON));
  } catch (e) { app.innerHTML = `<p class="notice"><b>The Quran data could not be loaded</b> (${esc(e.message)}).<br>The <code>data</code> folder must sit next to <code>index.html</code> on the server, with all its sub-folders. If you opened the file directly from your computer, serve the folder over HTTP instead, for example with <code>python3 -m http.server</code>.</p>`; return; }
  D.notes.notes.forEach(n => D.notesBy[n.ref] = n);
  buildLangSelect();
  addEventListener("hashchange", route);
  matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", applyTheme);
  await route();
  dailyNotify();
}
boot();
})();
</script>
</body>
</html>
